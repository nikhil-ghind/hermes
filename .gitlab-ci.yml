# GitLab CI/CD pipeline for Hermes, mirroring the Jenkins stages.

stages:
  - lint
  - test
  - build
  - docker
  - deploy

default:
  image: golang:1.22
  tags:
    - docker

variables:
  GO111MODULE: "on"
  CGO_ENABLED: "0"
  GOFLAGS: "-mod=readonly"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/go-build
    - .cache/go-mod

lint:
  stage: lint
  script:
    - go vet ./...
    - test -z "$(gofmt -l .)" || { echo "gofmt issues:"; gofmt -l .; exit 1; }
    - go install honnef.co/go/tools/cmd/staticcheck@2024.1
    - "$(go env GOPATH)/bin/staticcheck ./..."

test:
  stage: test
  script:
    - go test -race -covermode=atomic -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -n 1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week

build:
  stage: build
  script:
    - go build -trimpath -ldflags="-s -w" -o bin/hermes ./cmd/hermes
  artifacts:
    paths:
      - bin/hermes
    expire_in: 1 week

docker:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$IMAGE_NAME:latest"

deploy:
  stage: deploy
  image: bitnami/kubectl:1.29
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - kubectl -n hermes set image deployment/hermes hermes="$IMAGE_NAME:$IMAGE_TAG"
    - kubectl -n hermes rollout status deployment/hermes --timeout=120s
  environment:
    name: production
